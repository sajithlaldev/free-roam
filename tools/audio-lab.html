// Audio lab: renders the synthesised sounds offline, measures them, and offers WAV downloads.
import { ENGINE_WORKLET } from '/src/audio/engineWorklet.ts';

const SR = 44100;
function stats(buf) {

}
async function engine(diesel, idle, red) {
