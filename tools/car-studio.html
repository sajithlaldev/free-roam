<!doctype html><html><head><meta charset="utf-8"><title>Car studio</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#888}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
// Turntable for the vehicle models: ?model=fortuner|jimny&color=hex. window.shot(yawDeg, elevDeg, dist, [tx,ty,tz]) renders a view.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { FORTUNER, JIMNY, buildFortuner, buildJimny, restWheelY } from '/src/car.ts';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
scene.background = new THREE.Color(0x9fb4c8);
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.position.set(6, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xcfe3ff, 0x6b5a48, 0.6));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x8a7d6c, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const model = q.get('model') || 'fortuner';
const color = parseInt(q.get('color') || (model === 'fortuner' ? 'f1f1ee' : 'c5d313'), 16);
const v = (model === 'fortuner' ? buildFortuner : buildJimny)(color, 'KL-07 BF 4321');
const spec = model === 'fortuner' ? FORTUNER : JIMNY;
const wy = restWheelY(spec);
v.root.position.y = spec.wheelRadius - wy; // body sits on its springs
v.wheels.forEach((w) => (w.steer.position.y = wy));
v.updateRunningGear();
if (q.has('steer')) v.wheels.slice(0, 2).forEach((w) => (w.steer.rotation.y = 0.4));
if (q.has('brake')) v.brakeMat.emissiveIntensity = 2.2;
scene.add(v.root);
window.__v = v;
if (q.has('dirt')) v.dirt.value = +q.get('dirt');
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 200);
window.shot = (yaw, elev, dist, t = [0, 0.9, 0]) => {
  const a = THREE.MathUtils.degToRad(yaw), e = THREE.MathUtils.degToRad(elev);
  camera.position.set(t[0] + Math.sin(a) * Math.cos(e) * dist, t[1] + Math.sin(e) * dist, t[2] + Math.cos(a) * Math.cos(e) * dist);
  camera.lookAt(t[0], t[1], t[2]);
  renderer.render(scene, camera);
  let tris = 0; v.root.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  return { calls: renderer.info.render.calls, tris: Math.round(tris) };
};
window.__ready = true;
</script></body></html>
